services:
  redis:
    image: redis:7-alpine
    container_name: nosqllab2-redis
    ports:
      - "6379:6379"

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: nosqllab2-firestore
    # запуск с сохранением данных в firestore-data, подробности в firestore/emulator.sh
    command: sh /firestore/emulator.sh
    volumes:
      - ./firestore:/firestore
      - ./firestore-data:/data
    stop_grace_period: 30s
    ports:
      - "8080:8080"
