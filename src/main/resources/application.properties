spring.application.name=NoSqlLab2

server.port=${PORT:3030}

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:NoSqlLab2}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.redis.client-type=jedis
spring.data.redis.host=${LOCAL_REDIS_HOST:localhost}
spring.data.redis.port=${LOCAL_REDIS_PORT:6379}
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s
spring.data.redis.jedis.pool.enabled=true
spring.data.redis.jedis.pool.max-active=${REDIS_POOL_SIZE:3}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_SIZE:3}
spring.data.redis.jedis.pool.min-idle=1

app.redis.nodes=${REDIS_NODES:localhost:6379}

spring.cloud.gcp.firestore.project-id=nosqllab2-local
spring.cloud.gcp.firestore.emulator.enabled=true
spring.cloud.gcp.firestore.host-port=localhost:8080
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.firestore.FirestoreRepositoriesAutoConfiguration,\
  com.google.cloud.spring.autoconfigure.firestore.FirestoreTransactionManagerAutoConfiguration

app.node.id=${NODE_ID:node-1}

app.schedule.propagation-delay-ms=${SCHEDULE_PROPAGATION_DELAY_MS:5000}

app.jwt.secret=${JWT_SECRET:yXKAkg6g+s4l4Ct98GPhkIkr8VwJcm8ZH7qTQZo2eQ5csU2twNzBO5t9WB7+e5sj}
app.jwt.ttl=24h
